<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aradhana Verse - Top 10 Products</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .product-image-wrapper {
            width: 100%;
            height: 250px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: contain;  /* 🔥 CHANGE: ab puri image dikhegi */
            background: #ffffff;
        }

        .product-info {
            padding: 20px;
        }

        .product-rank {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .product-price {
            color: #e91e63;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .buy-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.3s ease;
        }

        .buy-btn:hover {
            opacity: 0.9;
        }

        .no-image {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        footer {
            text-align: center;
            color: white;
            padding: 30px;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛍️ Aradhana's Top Picks</h1>
            <p>Best products curated just for you ❤️</p>
            <p style="font-size: 0.9rem; margin-top: 10px;">👇 Click on "Buy Now" to get exclusive deals 👇</p>
        </header>

        <div class="products-grid" id="productsGrid"></div>

        <footer>
            <p>© 2026 Aradhana Verse | Best Deals for You</p>
        </footer>
    </div>

    <script>
        const products = [
            {
                rank: "🏆 Top Pick",
                image: "https://images.meesho.com/images/products/437978990/yxg2h_512.avif?width=512",
                title: "Cotton Saree with Blouse",
                price: "₹899",
                affiliateLink: "https://www.meesho.com/s/p/78rer2?utm_source=s_w"
            },
            {
                rank: "#2 Best Seller",
                image: "",  // Empty image - solid color dikhega
                title: "Beautiful Anarkali Suit",
                price: "₹1,299",
                affiliateLink: "#"
            },
            {
                rank: "#3 Trending",
                image: "",
                title: "Designer Earrings Set",
                price: "₹399",
                affiliateLink: "#"
            },
            {
                rank: "#4 Hot Deal",
                image: "",
                title: "Lehenga Choli for Women",
                price: "₹2,499",
                affiliateLink: "#"
            },
            {
                rank: "#5 Customer Choice",
                image: "",
                title: "Beauty Makeup Kit",
                price: "₹599",
                affiliateLink: "#"
            },
            {
                rank: "#6 Value Pick",
                image: "",
                title: "Footwear Sandals",
                price: "₹699",
                affiliateLink: "#"
            },
            {
                rank: "#7 New Arrival",
                image: "",
                title: "Handbag for Women",
                price: "₹1,099",
                affiliateLink: "#"
            },
            {
                rank: "#8 Organic",
                image: "",
                title: "Skin Care Combo",
                price: "₹799",
                affiliateLink: "#"
            },
            {
                rank: "#9 Budget Buy",
                image: "",
                title: "Hair Accessories Set",
                price: "₹199",
                affiliateLink: "#"
            },
            {
                rank: "#10 Special",
                image: "",
                title: "Wrist Watch for Women",
                price: "₹1,499",
                affiliateLink: "#"
            }
        ];

        function displayProducts() {
            const productsGrid = document.getElementById('productsGrid');
            productsGrid.innerHTML = '';
            
            products.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                
                // Image section - properly centered
                let imageHtml = '';
                if (product.image && product.image !== '') {
                    imageHtml = `
                        <div class="product-image-wrapper">
                            <img src="${product.image}" alt="${product.title}" class="product-image">
                        </div>
                    `;
                } else {
                    imageHtml = `
                        <div class="product-image-wrapper">
                            <div class="no-image">🛍️</div>
                        </div>
                    `;
                }
                
                productCard.innerHTML = `
                    ${imageHtml}
                    <div class="product-info">
                        <div class="product-rank">${product.rank}</div>
                        <div class="product-title">${product.title}</div>
                        <div class="product-price">${product.price}</div>
                        <a href="${product.affiliateLink}" target="_blank" class="buy-btn">🛒 Buy Now</a>
                    </div>
                `;
                
                productsGrid.appendChild(productCard);
            });
        }

        displayProducts();
    </script>
</body>
</html>
