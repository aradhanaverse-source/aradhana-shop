                    // Color code wala product (no flickering)
                    imageHtml = `<div style="width:100%; height:250px; background:${product.bgColor}; display:flex; align-items:center; justify-content:center; font-size:3rem;">🛍️</div>`;
                }
                
                productCard.innerHTML = `
                    ${imageHtml}
                    <div class="product-info">

                        <div class="product-price">${product.price}</div>
